name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-14,     pluginval: pluginval_macOS.zip,   pluginvalBinary: pluginval.app/Contents/MacOS/pluginval }
          - { name: Windows, os: windows-2022, pluginval: pluginval_Windows.zip, pluginvalBinary: pluginval.exe }
          - { name: Linux,   os: ubuntu-22.04, pluginval: pluginval_Linux.zip,   pluginvalBinary: pluginval }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else ctest --test-dir build -C Release --output-on-failure; fi

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          7z x pluginval.zip -opluginval > /dev/null
          chmod +x "pluginval/${{ matrix.pluginvalBinary }}" || true
          run="pluginval/${{ matrix.pluginvalBinary }}"
          [ "$RUNNER_OS" = "Linux" ] && run="xvfb-run -a $run"
          $run --strictness-level 10 --validate-in-process --skip-gui-tests --validate "build/Phasemap_artefacts/Release/VST3/Phasemap.vst3"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build/Phasemap_artefacts/Release
          for f in VST3/Phasemap.vst3 AU/Phasemap.component CLAP/Phasemap.clap LV2/Phasemap.lv2; do
            [ -e "$f" ] && cp -R "$f" "$GITHUB_WORKSPACE/dist/"
          done
          [ -d Standalone ] && cp -R Standalone/* "$GITHUB_WORKSPACE/dist/"
          cd "$GITHUB_WORKSPACE"
          cp LICENSE README.md dist/
          7z a "Phasemap-${{ matrix.name }}.zip" ./dist/* > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Phasemap-${{ matrix.name }}
          path: Phasemap-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Phasemap-*.zip
          generate_release_notes: true
