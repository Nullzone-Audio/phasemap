name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["website/**", "wrangler.jsonc", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["website/**", "wrangler.jsonc", "docs/**", "*.md"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-15-intel,     pluginval: pluginval_macOS.zip,   pluginvalBinary: pluginval.app/Contents/MacOS/pluginval }
          - { name: Windows, os: windows-2022, pluginval: pluginval_Windows.zip, pluginvalBinary: pluginval.exe }
          - { name: Linux,   os: ubuntu-22.04, pluginval: pluginval_Linux.zip,   pluginvalBinary: pluginval }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else ctest --test-dir build -C Release --output-on-failure; fi

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          7z x pluginval.zip -opluginval > /dev/null
          chmod +x "pluginval/${{ matrix.pluginvalBinary }}" || true
          run="pluginval/${{ matrix.pluginvalBinary }}"
          [ "$RUNNER_OS" = "Linux" ] && run="xvfb-run -a $run"
          $run --strictness-level 10 --validate-in-process --skip-gui-tests --validate "build/Phasemap_artefacts/Release/VST3/Phasemap.vst3"

      - name: Version
        shell: bash
        run: |
          label=$(sed -n 's/^set(PHASEMAP_VERSION_LABEL "\(.*\)").*/\1/p' CMakeLists.txt)
          version=$(sed -n 's/^project(Phasemap VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "LABEL=$label" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SLUG=Phasemap-${label// /-}" >> "$GITHUB_ENV"
          mkdir -p out

      - name: Installer (macOS .pkg)
        if: runner.os == 'macOS'
        run: packaging/macos/build_pkg.sh build/Phasemap_artefacts/Release "$VERSION" "out/$SLUG-macOS.pkg"

      - name: Installer (Windows Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/DVersionLabel=$env:LABEL" "/DOutputName=$env:SLUG-Windows-Setup" `
                  "/DArtefacts=$env:GITHUB_WORKSPACE\build\Phasemap_artefacts\Release" packaging\windows\Phasemap.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "$env:SLUG-Windows-Setup.exe" out\

      - name: Archive (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          dir="$SLUG-Linux-x86_64"
          mkdir -p "$dir"
          cd build/Phasemap_artefacts/Release
          cp -R VST3/Phasemap.vst3 LV2/Phasemap.lv2 Standalone/Phasemap "$GITHUB_WORKSPACE/$dir/"
          [ -e CLAP/Phasemap.clap ] && cp -R CLAP/Phasemap.clap "$GITHUB_WORKSPACE/$dir/"
          cd "$GITHUB_WORKSPACE"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh LICENSE README.md "$dir/"
          tar -czf "out/$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: Phasemap-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release name
        run: echo "LABEL=$(sed -n 's/^set(PHASEMAP_VERSION_LABEL "\(.*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: Phasemap ${{ env.LABEL }}
          body_path: .github/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: out/*
          generate_release_notes: true
